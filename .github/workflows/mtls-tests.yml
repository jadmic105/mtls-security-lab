name: mTLS tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  mtls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt
          else pip install fastapi uvicorn requests; fi
      - name: Generate fresh certificates
        run: ./scripts/gen_certs.sh
      - name: Run mTLS tests
        run: ./scripts/run_mtls_tests.sh
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
